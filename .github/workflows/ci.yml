name: DoctAgri CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────
  # Job 1 — Linting (Flutter + React)
  # ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # React Dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doctagri-dashboard/package-lock.json

      - run: npm ci
        working-directory: doctagri-dashboard

      - run: npm run lint
        working-directory: doctagri-dashboard

  # ────────────────────────────────────────────────
  # Job 2 — Tests (Flutter + React)
  # ────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Create .env placeholder for Flutter tests
        run: |
          cat <<EOF > .env
          OPEN_WEATHER_API_KEY=placeholder
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          EOF

      - run: flutter test

      # React Dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doctagri-dashboard/package-lock.json

      - run: npm ci
        working-directory: doctagri-dashboard

      - run: npm test
        working-directory: doctagri-dashboard

  # ────────────────────────────────────────────────
  # Job 3 — Build Dashboard (après lint + test)
  # ────────────────────────────────────────────────
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doctagri-dashboard/package-lock.json

      - run: npm ci
        working-directory: doctagri-dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: doctagri-dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: doctagri-dashboard/dist/
          retention-days: 7

  # ────────────────────────────────────────────────
  # Job 4 — Deploy Dashboard (main uniquement)
  # ────────────────────────────────────────────────
  deploy-dashboard:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
