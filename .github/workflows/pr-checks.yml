name: PR Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze:
    name: Dart analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart analyzer
        run: dart analyze --no-fatal-warnings --no-fatal-infos

  format:
    name: Dart formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.4'

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/unit/

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.4'

      - name: Pub audit
        run: dart pub audit --no-probably-safe