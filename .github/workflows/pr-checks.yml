name: Repository guardrails
on:
  workflow_call:
permissions:
  contents: read
jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/quality.py repository
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python scripts/quality.py python
