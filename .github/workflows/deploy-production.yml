# Preparation only: does not publish to a store or apply SQL migrations.
name: Prepare signed Android release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Android build number, higher than the distributed version
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare release APK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python scripts/quality.py repository
      - run: python scripts/quality.py flutter
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python scripts/prepare_android_signing.py
      - name: Build configured APK
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          : "${SUPABASE_URL:?Missing Supabase URL}"
          : "${SUPABASE_ANON_KEY:?Missing public Supabase key}"
          flutter build apk --release --build-number="$BUILD_NUMBER" --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks
